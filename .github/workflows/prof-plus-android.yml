name: PROF+ Android CI & Release Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prof-plus-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-release:
    name: Test, Sign & Build APK / AAB (prof+)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (required by AGP 9.1 / Gradle 9.3.1)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK & Build-Tools 36.0.0
        uses: android-actions/setup-android@v3

      - name: Ensure Android SDK Build-Tools 36.0.0 installed
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verify Gradle invocation command
        id: gradle_cmd
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "cmd=./gradlew" >> "$GITHUB_OUTPUT"
          else
            echo "Wrapper gradlew absent: utilisation de Gradle 9.3.1 installé via setup-gradle."
            echo "cmd=gradle" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore optional google-services.json from GitHub Secret & verify assets
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ ! -f "app/google-services.json" ]; then
            if [ -n "${GOOGLE_SERVICES_JSON_BASE64}" ]; then
              printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '[:space:]' | base64 --decode > app/google-services.json
              echo "app/google-services.json restauré depuis GOOGLE_SERVICES_JSON_BASE64."
            else
              echo "::error::Fichier app/google-services.json introuvable et secret GOOGLE_SERVICES_JSON_BASE64 absent."
              exit 1
            fi
          fi

          for required in \
            "app/src/main/res/values/firebase_applet_config.xml" \
            "app/src/main/res/drawable/img_profplus_logo.jpg" \
            "app/src/main/res/font/plus_jakarta_sans.ttf"; do
            if [ ! -f "$required" ]; then
              echo "::error::Ressource critique manquante : $required"
              exit 1
            fi
          done

      - name: Run Unit & Robolectric Tests (testDebugUnitTest)
        run: |
          ${{ steps.gradle_cmd.outputs.cmd }} :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload Test Reports Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prof-plus-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 30
          if-no-files-found: warn

      - name: Validate Release Signing Secrets & Prepare Upload Keystore
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        id: signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          if [ -z "${RELEASE_KEYSTORE_BASE64}" ]; then
            echo "::error::Secret GitHub manquant : RELEASE_KEYSTORE_BASE64 (keystore .jks encodé en base64)."
            missing=1
          fi
          if [ -z "${STORE_PASSWORD}" ]; then
            echo "::error::Secret GitHub manquant : STORE_PASSWORD."
            missing=1
          fi
          if [ -z "${KEY_PASSWORD}" ]; then
            echo "::error::Secret GitHub manquant : KEY_PASSWORD."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Ajoutez RELEASE_KEYSTORE_BASE64, STORE_PASSWORD et KEY_PASSWORD dans GitHub -> Settings -> Secrets and variables -> Actions (alias requis : upload)."
            exit 1
          fi

          KEYSTORE_FILE="${{ runner.temp }}/my-upload-key.jks"
          printf '%s' "${RELEASE_KEYSTORE_BASE64}" | tr -d '[:space:]' | base64 --decode > "${KEYSTORE_FILE}"
          if [ ! -s "${KEYSTORE_FILE}" ]; then
            echo "::error::Le keystore décodé est vide."
            exit 1
          fi

          keytool -list -keystore "${KEYSTORE_FILE}" -storepass "${STORE_PASSWORD}" -alias upload >/dev/null
          echo "KEYSTORE_PATH=${KEYSTORE_FILE}" >> "$GITHUB_ENV"

      - name: Build Signed Release APK (assembleRelease) and Release AAB (bundleRelease)
        if: steps.signing.outcome == 'success'
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ${{ steps.gradle_cmd.outputs.cmd }} :app:assembleRelease :app:bundleRelease --no-daemon --no-configuration-cache --stacktrace

      - name: Verify Release APK & AAB Presence, Size, and Cryptographic Signatures
        if: steps.signing.outcome == 'success'
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          AAB_PATH="app/build/outputs/bundle/release/app-release.aab"

          if [ ! -s "${APK_PATH}" ]; then
            echo "::error::APK Release introuvable ou vide : ${APK_PATH}"
            exit 1
          fi
          if [ ! -s "${AAB_PATH}" ]; then
            echo "::error::AAB Release introuvable ou vide : ${AAB_PATH}"
            exit 1
          fi

          ls -lh "${APK_PATH}" "${AAB_PATH}"

          APKSIGNER_BIN="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner | sort -V | tail -n 1)"
          if [ -z "${APKSIGNER_BIN}" ]; then
            echo "::error::Outil apksigner introuvable dans Android SDK build-tools."
            exit 1
          fi

          echo "=== Vérification signature APK ==="
          "${APKSIGNER_BIN}" verify --verbose --print-certs "${APK_PATH}"

          echo "=== Vérification signature AAB ==="
          jarsigner -verify -verbose -certs "${AAB_PATH}"

      - name: Clean up temporary release keystore
        if: always()
        run: |
          rm -f "${{ runner.temp }}/my-upload-key.jks"

      - name: Upload Signed Release APK Artifact
        if: steps.signing.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: prof-plus-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Signed Release AAB Artifact
        if: steps.signing.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: prof-plus-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error
